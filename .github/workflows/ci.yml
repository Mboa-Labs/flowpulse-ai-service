# Intégration continue : le serveur ne déploie une version que si ces tests passent.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  image:
    # L'image Docker est celle du serveur : on vérifie qu'elle se construit et que le modèle de prévision s'y charge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flowpulse-ai-service .
      - run: docker run --rm flowpulse-ai-service python -c "import lightgbm, chromadb, pandas; print('dépendances natives OK')"
